name: Release Extension

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v1.1.0, etc.

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Needed to create releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run compile

      - name: Package extension
        run: npm run package

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          NOTES=$(awk -v ver="## [v$VERSION]" '
            index($0, ver) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="_No changelog entry found for v$VERSION in CHANGELOG.md._"
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: GitHub Desktop for VS Code v${{ steps.get_version.outputs.VERSION }}
          body: |
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation

            ### From VSIX file:
            1. Download the `vscode-github-desktop-${{ steps.get_version.outputs.VERSION }}.vsix` file from the assets below
            2. In VS Code, go to Extensions view (Ctrl+Shift+X)
            3. Click on the "..." menu and select "Install from VSIX..."
            4. Select the downloaded file

            ### From Command Line:
            ```bash
            code --install-extension vscode-github-desktop-${{ steps.get_version.outputs.VERSION }}.vsix
            ```

            ## Requirements
            - VS Code 1.84.0 or higher
            - Git installed and accessible in PATH
            - GitHub account for full functionality

            ## Support
            - 🐛 [Report Issues](https://github.com/betaversionio/github-desktop/issues)
            - 💡 [Feature Requests](https://github.com/betaversionio/github-desktop/discussions)
            - ⭐ [Star on GitHub](https://github.com/betaversionio/github-desktop)

          draft: false
          prerelease: false
          files: |
            vscode-github-desktop-${{ steps.get_version.outputs.VERSION }}.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to VS Code Marketplace
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npm install -g @vscode/vsce
            vsce publish -p $VSCE_PAT --allow-package-secrets github
            echo "✅ Published to VS Code Marketplace"
          else
            echo "⚠️ VSCE_PAT secret not set, skipping marketplace publish"
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        continue-on-error: true  # Don't fail if marketplace publish fails